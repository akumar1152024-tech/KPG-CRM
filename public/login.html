<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPG Coach — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A4A3A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 40px; display: block; margin-bottom: 8px; }
    .logo-name { font-size: 20px; font-weight: 700; color: #0A4A3A; }
    .logo-sub  { font-size: 13px; color: #6c757d; margin-top: 2px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type=password] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input[type=password]:focus { border-color: #0F6E56; }
    .error {
      background: #fee2e2;
      color: #991b1b;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    button {
      width: 100%;
      padding: 11px;
      background: #0F6E56;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 18px;
      transition: background .15s;
    }
    button:hover { background: #0A4A3A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">💪</span>
      <div class="logo-name">KPG Coach</div>
      <div class="logo-sub">Kash Performance Group</div>
    </div>
    <form method="POST" action="/login" id="loginForm">
      <div class="error" id="errMsg">Incorrect password. Try again.</div>
      <div style="margin-bottom:20px">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password" />
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    // Show error if redirected back after bad password
    if (document.referrer.includes('/login') || window.location.search.includes('error')) {
      document.getElementById('errMsg').classList.add('show');
    }
  </script>
</body>
</html>
