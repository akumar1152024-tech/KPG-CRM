<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPG Coaching Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body data-coach-name="Kash">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">💪</span>
        <span class="logo-text">KPG Coach</span>
      </div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">Main</div>
      <a href="#" class="nav-item active" data-section="dashboard">Dashboard</a>
      <a href="#" class="nav-item" data-section="crm">CRM <span class="nav-badge" id="crmNavBadge"></span></a>
      <a href="#" class="nav-item" data-section="finance">Finance</a>
      <a href="#" class="nav-item" data-section="pipeline">Pipeline</a>

      <div class="nav-group-label">Marketing</div>
      <a href="#" class="nav-item" data-section="leads">Leads</a>
      <a href="#" class="nav-item" data-section="meta-ads">Meta Ads</a>
      <a href="#" class="nav-item" data-section="content">Content</a>

      <div class="nav-group-label">Tools</div>
      <a href="#" class="nav-item" data-section="automations">Automations</a>
      <a href="#" class="nav-item" data-section="tasks">Tasks <span class="nav-badge danger" id="tasksNavBadge"></span></a>
      <a href="#" class="nav-item" data-section="sheets">Google Sheets</a>
      <a href="#" class="nav-item" data-section="settings">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/webhooks/test" target="_blank" class="webhook-link">Webhook Docs</a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-right">
        <span id="topbarGreeting" class="topbar-greeting"></span>
      </div>
    </header>

    <main class="content">
      <section id="section-dashboard" class="section active"><div class="loading-cell">Loading…</div></section>
      <section id="section-crm"       class="section"></section>
      <section id="section-finance"   class="section"></section>
      <section id="section-pipeline"  class="section"></section>
      <section id="section-leads"     class="section"></section>
      <section id="section-meta-ads"  class="section"></section>
      <section id="section-content"   class="section"></section>
      <section id="section-automations" class="section"></section>
      <section id="section-tasks"     class="section"></section>
      <section id="section-sheets"    class="section"></section>
      <section id="section-settings"  class="section"></section>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/crm.js"></script>
  <script src="js/finance.js"></script>
</body>
</html>
